<div class="shell">
  <header class="shell__header">
    <div class="brand">
      <span class="brand__logo brand__logo--on-dark">C</span>
      <span>
        <span class="brand__name">Cortracker Inc</span>
        <span class="brand__tagline">Timesheet Management System</span>
      </span>
    </div>

    <div class="shell__actions">
      @if (showNotifications()) {
        <button type="button" class="icon-button" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M6 8a6 6 0 1 1 12 0c0 3.6 1 5.4 1.6 6.2a1 1 0 0 1-.8 1.6H5.2a1 1 0 0 1-.8-1.6C5 13.4 6 11.6 6 8Z"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path d="M9.5 18a2.5 2.5 0 0 0 5 0" stroke-linecap="round" />
          </svg>
          @if (notificationCount() > 0) {
            <span class="icon-button__badge">{{ notificationCount() }}</span>
          }
        </button>
      }

      <div class="user-chip">
        <span class="user-chip__avatar">{{ userInitial }}</span>
        <span class="user-chip__info">
          <span class="user-chip__name">{{ userName() }}</span>
          <span class="user-chip__role">{{ userRole() }}</span>
        </span>
      </div>

      <button type="button" class="btn btn--secondary" (click)="logOut()">Log out</button>
    </div>
  </header>
  <div class="shell__accent"></div>

  <nav class="shell__nav">
    @for (item of navItems(); track item.path) {
      @if (item.disabled) {
        <span class="nav-tab nav-tab--disabled" [attr.aria-disabled]="true">
          {{ item.label }}
        </span>
      } @else {
        <a class="nav-tab" [routerLink]="item.path" routerLinkActive="nav-tab--active">
          {{ item.label }}
        </a>
      }
    }
  </nav>

  <main class="shell__body">
    <router-outlet />
  </main>
</div>
